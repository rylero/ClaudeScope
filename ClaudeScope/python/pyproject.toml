[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claudescope-py"
version = "0.1.0"
description = "Python client for ClaudeScope: query .wpilog files and live NetworkTables straight into pandas DataFrames."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pandas>=1.5",
    "pyarrow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["claudescope*"]
